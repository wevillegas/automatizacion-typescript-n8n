services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  agent:
    build: .
    environment:
      DATABASE_URL: ${AGENT_DATABASE_URL:-postgresql://agent:agent@postgres:5432/agent}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      API_KEY: ${API_KEY}
      TRIAGE_RATE_LIMIT: ${TRIAGE_RATE_LIMIT:-20}
      N8N_NOTIFY_URL: ${N8N_NOTIFY_URL:-http://n8n:5678/webhook/decision-notify}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      WEBHOOK_URL: http://localhost:5678/
      API_KEY: ${API_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  n8n_data:
